<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1; url=audience.html">
    <title>Front-End Slides</title>
    <meta name="description" content="اسلایدهای جامع و تعاملی آموزش فرانت‌اند و HTML & CSS با تم روشن بهینه‌شده برای پروژکتور، طراحی کاملاً فارسی، راست‌چین و واکنش‌گرا">
    <meta property="og:title" content="Front-End Slides">
    <meta property="og:description" content="اسلایدهای جامع و تعاملی آموزش فرانت‌اند و HTML & CSS با تم روشن بهینه‌شده برای پروژکتور، طراحی کاملاً فارسی، راست‌چین و واکنش‌گرا">
    <link rel="stylesheet" href="projector-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
            font-family: var(--ppt-font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portal-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 36px 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
        }

        .portal-title {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 8px;
        }

        .portal-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .portal-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .portal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .portal-btn.primary {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        }

        .portal-btn.primary:hover {
            background: #1d4ed8;
        }

        .portal-btn.secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .portal-btn.secondary:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .redirect-notice {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
    <script>
        // Automatic redirection to audience presentation view
        setTimeout(() => {
            window.location.replace("audience.html");
        }, 1200);
    </script>
</head>

<body>
    <div class="portal-card">
        <i class="fas fa-chalkboard-user" style="font-size: 40px; color: #2563eb; margin-bottom: 16px;"></i>
        <h1 class="portal-title">آموزش جامع فرانت‌اند و HTML & CSS</h1>
        <p class="portal-subtitle">اسلایدهای کلاسی بهینه‌سازی‌شده برای پروژکتور با تم روشن، راست‌چین و کاملاً واکنش‌گرا</p>

        <div class="portal-links">
            <a href="audience.html" class="portal-btn primary">
                <i class="fas fa-play"></i>
                <span>ورود به نمایش پروژکتور (Audience View)</span>
            </a>
            <a href="presenter.html" class="portal-btn secondary">
                <i class="fas fa-microphone"></i>
                <span>کنسول مدرس و یادداشت‌ها (Presenter View)</span>
            </a>
        </div>

        <p class="redirect-notice">در حال انتقال خودکار به نمایشگر پروژکتور...</p>
    </div>
</body>

</html>
