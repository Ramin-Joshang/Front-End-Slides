<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>Audience View</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        #viewPort {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #slideWrapper {
            position: relative;
            width: 1280px;
            height: 720px;
            transform-origin: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.6s ease;
        }

        .old {
            opacity: 0;
            pointer-events: none;
        }

        .new {
            opacity: 1;
        }

        /* slide counter */
        #slideCounter {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
        }

        /* نیمه‌های صفحه برای کلیک */
        .click-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 5;
            cursor: pointer;
        }

        .click-zone.left {
            left: 0;
        }

        .click-zone.right {
            right: 0;
        }
    </style>
</head>

<body>
    <div id="viewPort">
        <div id="slideWrapper"></div>
    </div>
    <div id="slideCounter">1 / 32</div>
    <div class="click-zone left" id="leftZone"></div>
    <div class="click-zone right" id="rightZone"></div>

    <script>
        const totalSlides = 32;
        let currentIndex = 0; // zero-based
        const wrapper = document.getElementById('slideWrapper');
        const counter = document.getElementById('slideCounter');
        let currentIframe = null;
        let oldIframe = null;

        function resizeSlideWrapper() {
            const viewW = window.innerWidth;
            const viewH = window.innerHeight;
            const slideW = 1280;
            const slideH = 720;
            const scaleX = viewW / slideW;
            const scaleY = viewH / slideH;
            const scale = Math.min(scaleX, scaleY);
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeSlideWrapper);
        window.addEventListener('load', resizeSlideWrapper);

        function updateCounter() {
            counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
        }

        function loadSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            currentIndex = index;
            const num = index + 1;
            const src = `slide-${String(num).padStart(2, '0')}.html`;

            const newFrame = document.createElement('iframe');
            newFrame.src = src;
            newFrame.className = 'new';

            if (currentIframe) {
                currentIframe.classList.remove('new');
                currentIframe.classList.add('old');
                oldIframe = currentIframe;
            }

            wrapper.appendChild(newFrame);
            currentIframe = newFrame;

            if (oldIframe) {
                setTimeout(() => {
                    if (oldIframe) {
                        wrapper.removeChild(oldIframe);
                        oldIframe = null;
                    }
                }, 700);
            }
            updateCounter();
        }

        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                loadSlide(currentIndex + 1);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                loadSlide(currentIndex - 1);
            }
        }

        // کیبورد
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        // کلیک روی نیمه چپ/راست
        document.getElementById('leftZone').addEventListener('click', prevSlide);
        document.getElementById('rightZone').addEventListener('click', nextSlide);

        // همگام‌سازی با Presenter از طریق BroadcastChannel
        const channel = new BroadcastChannel('presentation-channel');
        channel.onmessage = (event) => {
            if (event.data.type === 'slide-change') {
                loadSlide(event.data.slideIndex);
            }
        };

        // بارگذاری اولیه
        loadSlide(0);
        resizeSlideWrapper();
    </script>
</body>

</html>
