<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenter Console - Comprehensive HTML & CSS Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="projector-theme.css">
    <style>
        body {
            font-family: var(--ppt-font-body);
            background: #0f172a;
            color: #f8fafc;
            direction: ltr;
        }

        .slide-thumb {
            width: 190px;
            height: 107px;
            overflow: hidden;
            border: 2px solid #334155;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            background: #ffffff;
            flex-shrink: 0;
        }

        .slide-thumb:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .slide-thumb.active {
            border-color: #2563eb;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.5);
            transform: scale(1.03);
        }

        .slide-thumb iframe {
            width: 1280px;
            height: 720px;
            transform: scale(0.148);
            transform-origin: 0 0;
            border: none;
            pointer-events: none;
        }

        .slide-thumb-num {
            position: absolute;
            bottom: 4px;
            right: 6px;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            font-family: var(--ppt-font-mono);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
        }

        .notes-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            line-height: 1.7;
            font-size: 15px;
            color: #cbd5e1;
            overflow-y: auto;
        }

        .timer-display {
            font-family: var(--ppt-font-mono);
            font-size: 2.2rem;
            color: #38bdf8;
            font-weight: 700;
        }
    </style>
</head>

<body class="p-4 h-screen flex flex-col gap-3">
    <!-- Top Header Bar -->
    <div class="flex items-center justify-between bg-slate-900/90 p-3 rounded-xl border border-slate-700 shadow-md">
        <div class="flex items-center gap-4">
            <span class="text-xl font-bold text-blue-400 flex items-center gap-2">
                <i class="fas fa-microphone-lines text-cyan-400"></i>
                <span>Presenter Console</span>
            </span>
            <span id="currentSlideInfo" class="text-slate-400 font-mono text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                Slide 1 of 32
            </span>
            <span id="slideTitleDisplay" class="text-white text-base font-semibold bg-blue-900/40 text-blue-200 border border-blue-700/50 px-3 py-1 rounded-full">
                Slide Title
            </span>
        </div>

        <div class="flex items-center gap-3">
            <a href="audience.html" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-full text-sm flex items-center gap-2 transition" title="Open Audience View">
                <i class="fas fa-desktop"></i>
                <span>Audience View</span>
            </a>
            <button id="btnPrevTop" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-full text-sm" title="Previous Slide (Left Arrow)">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button id="btnNextTop" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-full text-sm" title="Next Slide (Right Arrow)">
                <i class="fas fa-chevron-right"></i>
            </button>
            <button onclick="toggleFullscreen()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-full text-sm" title="Fullscreen Mode">
                <i class="fas fa-expand"></i>
            </button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex flex-1 gap-4 min-h-0">
        <!-- Center/Left: Current slide preview & Speaker notes -->
        <div class="flex-1 flex flex-col gap-3 min-w-0">
            <!-- Current Slide Frame -->
            <div class="relative bg-slate-900 rounded-xl border border-slate-700 p-2 flex-1 flex items-center justify-center overflow-hidden">
                <iframe id="mainSlideIframe" src="slide-01.html" class="border-0 rounded-lg w-full h-full shadow-lg" style="max-width:1280px; max-height:720px;"></iframe>
            </div>

            <!-- Speaker Notes Box -->
            <div class="h-44 flex flex-col gap-2">
                <div class="flex items-center justify-between text-xs text-slate-400 font-semibold px-1">
                    <span class="flex items-center gap-1">
                        <i class="fas fa-clipboard-list text-amber-400"></i>
                        <span>Speaker Notes & Teaching Guide:</span>
                    </span>
                    <span class="text-slate-500">Private (Not visible to audience)</span>
                </div>
                <div class="notes-box flex-1" id="notesText">
                    Loading speaker notes...
                </div>
            </div>
        </div>

        <!-- Right Side: Next Slide Preview, Stopwatch, Navigation -->
        <div class="w-80 flex flex-col gap-3 flex-shrink-0">
            <!-- Next Slide Preview Card -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex flex-col gap-2">
                <div class="flex items-center justify-between text-xs text-slate-400 font-semibold">
                    <span class="flex items-center gap-1">
                        <i class="fas fa-forward text-blue-400"></i>
                        <span>Next Slide:</span>
                    </span>
                    <span id="nextSlideNum" class="font-mono text-cyan-400">Slide 2</span>
                </div>
                <div class="w-full h-36 bg-slate-950 rounded-lg border border-slate-800 overflow-hidden relative">
                    <iframe id="nextSlideIframe" src="slide-02.html" class="w-[1280px] h-[720px] pointer-events-none origin-top-left" style="transform: scale(0.23); width: 1280px; height: 720px;"></iframe>
                </div>
                <span id="nextSlideTitle" class="text-xs text-slate-300 truncate">Next Slide Title</span>
            </div>

            <!-- Presentation Timer -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 flex flex-col items-center">
                <span class="text-slate-400 text-xs mb-1 flex items-center gap-1">
                    <i class="fas fa-stopwatch text-cyan-400"></i>
                    <span>Presentation Timer</span>
                </span>
                <span class="timer-display" id="timer">00:00</span>
                <div class="flex gap-2 mt-3 w-full">
                    <button id="timerToggle" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-1.5 rounded-lg text-sm font-semibold transition">
                        ▶ Start
                    </button>
                    <button id="timerReset" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 px-3 py-1.5 rounded-lg text-sm transition">
                        ↺ Reset
                    </button>
                </div>
            </div>

            <!-- Quick Jump to Slide -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-4">
                <span class="text-slate-400 text-xs block mb-2 font-semibold">🔢 Jump directly to slide:</span>
                <div class="flex gap-2">
                    <input type="number" id="gotoSlideInput" min="1" max="32" value="1" class="w-20 bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-white text-center font-mono">
                    <button id="gotoSlideBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-cyan-400 font-bold py-1.5 rounded-lg text-sm transition">
                        Go
                    </button>
                </div>
            </div>

            <!-- Autoplay Mode -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-4">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-slate-300 text-sm font-semibold">🎬 Auto-Advance Slides</span>
                    <input type="checkbox" id="autoplayToggle" class="w-4 h-4 accent-blue-500 cursor-pointer">
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-slate-400 text-xs">Interval (sec):</label>
                    <input type="number" id="autoplayInterval" value="15" min="3" max="180" class="w-16 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white text-xs font-mono text-center">
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Thumbnails Strip -->
    <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 overflow-x-auto flex gap-3 shadow-inner" id="thumbnailsContainer"></div>

    <script>
        const totalSlides = 32;
        let currentSlide = 0;

        // Slide Titles
        const slideTitles = [
          "Comprehensive HTML & CSS Course - Welcome & Overview",
          "Welcome: Your First Step in the Web Development World",
          "Meet Your Instructor: Ramin Joshaghani",
          "Core Skills You Will Master in This Course",
          "Complete HTML & CSS Learning Roadmap",
          "Front-End vs Back-End: Understanding the Architecture",
          "How the Web Works: High-Level System Overview",
          "The Internet: Global Network of Interconnected Systems",
          "Three Core Web Roles: Client, Browser, and Server",
          "When You Type a URL: Anatomy of a Web Request",
          "HTTP vs HTTPS: Secure Communication Protocols",
          "HTTP Architecture: Client Request & Server Response",
          "Core Web Triad: Domain, Hosting, and DNS Resolution",
          "HTML: The Semantic Skeleton and Structural Bones of the Web",
          "CSS: The Visual Skin, Layout, and Design of the Web",
          "JavaScript: Dynamic Behavior, Interactivity, and Logic",
          "Modern Web Developer Ecosystem & Tooling",
          "Real-World Production Front-End Case Studies",
          "Essential Front-End Developer Toolbelt",
          "Google Chrome & DevTools: The Professional Web Workbench",
          "Visual Studio Code: The Modern Industry-Standard Editor",
          "VS Code Installation & Environment Setup Guide",
          "Essential VS Code Extensions for High Productivity",
          "Standard Project Directory & File Hierarchy",
          "Hands-on Lab: Creating Your First Project Folder",
          "Hands-on Lab: Creating the index.html Entry File",
          "Writing Your Very First HTML Code: Headings & Paragraphs",
          "Launching and Previewing Your Webpage in Chrome",
          "Professional Developer Habits & Clean Code Best Practices",
          "Common Beginner Pitfalls & Step-by-Step Solutions",
          "Lesson 01 Summary: Milestones & Key Takeaways",
          "Homework Assignment & Preparation for Lesson 02"
];

        // Rich Speaker Notes in Persian for All 32 Slides
        const slidesNotes = [
          "Warm welcome to students. Introduce course vision: taking students from absolute zero to job-ready front-end web developers with modern industry practices.",
          "Break down the 3 core pillars of Lesson 01: understanding fundamental web concepts, mastering the 3 primary web languages, and writing your first lines of code.",
          "Instructor background and real-world software engineering experience. Emphasize project-driven learning, practical problem solving, and confidence building.",
          "Review the 6 fundamental competencies students gain: semantic HTML5, modern CSS3 layouts, Flexbox & Grid, responsive mobile-first design, interactive CSS, and clean architecture.",
          "Walk through the 11 sequential course milestones; explain that every concept is reinforced with hands-on labs and real portfolio projects.",
          "The restaurant dining room vs kitchen analogy: Front-End is what users experience visually and interact with, while Back-End handles databases, servers, and business logic securely.",
          "Explain the 3-stage web cycle: 1. Client initiates request -> 2. Server processes and responds -> 3. Browser parses assets and renders the visual page.",
          "Demystify the physical internet: submarine fiber optic cables, global data centers, routers, and IP packet transmission via TCP/IP protocols.",
          "Define the 3 core pillars: Client (requesting device), Browser (client engine interpreting code into pixels), and Server (24/7 cloud host serving assets).",
          "Walk through the 6 micro-steps of entering a URL: URL entry, DNS lookup, TCP/SSL handshake, HTTP request, file payload delivery, and DOM rendering.",
          "Security contrast between plaintext HTTP (port 80) and encrypted HTTPS (port 443). Analogy of public postcards versus sealed tamper-evident letters with SSL/TLS.",
          "HTTP transaction cycle and HTTP status codes: 200 OK (success), 301/302 Redirect, 404 Not Found (missing asset), and 500 Internal Server Error.",
          "Analogy of Domain (street address / home name), DNS (phonebook translating name to IP), and Web Hosting (the physical house containing files).",
          "Introduce HTML as the structural skeleton and bones of web documents; reinforce that HTML is a declarative markup language, not a procedural programming language.",
          "CSS as styling, typography, color theory, and spatial layout; showcase visual before-and-after comparison of raw unstyled HTML vs styled presentation.",
          "JavaScript as the dynamic brain and muscles: handling user clicks, state changes, asynchronous API communication, and interactive animations.",
          "Auxiliary tooling in modern engineering: Git & GitHub for version control, REST/GraphQL APIs for data flow, and modern web frameworks.",
          "Highlighting prominent front-end applications: Apple store showcasing typography and product design, Slack web app, and Netflix streaming UI.",
          "The developer workspace: Visual Studio Code as the primary coding workshop and Google Chrome DevTools as the inspection and debugging suite.",
          "Chrome DevTools deep dive: Elements inspector for live DOM/CSS manipulation, Console for runtime errors and logs, and Network tab for asset waterfalls.",
          "Why VS Code dominates web development: ultra-fast startup, rich extension marketplace, built-in terminal, Git integration, and robust IntelliSense.",
          "Step-by-step setup for Windows/Mac/Linux: downloading from official site, installer steps, and making sure to enable \"Add to PATH\" and context menu actions.",
          "Essential extension suite: Live Server for instant auto-reload on file save, Prettier for code formatting, Auto Rename Tag, and Material Icon Theme.",
          "Project organization guidelines: dedicated project root folder, lowercase kebab-case naming without spaces or special characters, and index.html entry point.",
          "Hands-on lab: Guided practice where all students create the my-first-project directory and open it directly inside VS Code.",
          "Hands-on lab: Creating the index.html file in VS Code explorer; explain why web servers automatically look for index.html as the default homepage.",
          "First code writing session: crafting <h1> heading and <p> paragraph; demonstrating Emmet shortcut expansions and the Tab key for maximum efficiency.",
          "Three ways to test web files in Chrome: Drag & Drop into browser, Right-click Open With Chrome, and clicking Go Live with the Live Server extension.",
          "Best programming habits: consistent indentation, meaningful code comments, standard semantic tags, and understanding code before adopting it.",
          "Troubleshooting beginner mistakes: syntax typos in tags, missing closing tags, unsaved files (Ctrl+S), accidental .txt extension, and browser cache clearing.",
          "Lesson 01 milestone celebration: congratulating students on building and rendering their very first live web page.",
          "Homework task: verify development environment setup, build a personal introductory webpage with biographical content, and preview Lesson 02 (semantic tags)."
];

        function toPersianDigits(n) {
            const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return n.toString().replace(/\d/g, x => farsiDigits[x]);
        }

        // Build Thumbnails
        const thumbContainer = document.getElementById('thumbnailsContainer');
        for (let i = 0; i < totalSlides; i++) {
            const thumb = document.createElement('div');
            thumb.className = `slide-thumb ${i === 0 ? 'active' : ''}`;
            thumb.innerHTML = `
                <iframe src="slide-${String(i + 1).padStart(2, '0')}.html" sandbox="allow-scripts allow-same-origin"></iframe>
                <span class="slide-thumb-num">${toPersianDigits(i + 1)}</span>
            `;
            thumb.addEventListener('click', () => goToSlide(i));
            thumb.dataset.index = i;
            thumbContainer.appendChild(thumb);
        }

        function updateThumbs() {
            document.querySelectorAll('.slide-thumb').forEach((thumb, idx) => {
                thumb.classList.toggle('active', idx === currentSlide);
                if (idx === currentSlide) {
                    thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });
        }

        function updateMainView() {
            const num = currentSlide + 1;
            const src = `slide-${String(num).padStart(2, '0')}.html`;
            document.getElementById('mainSlideIframe').src = src;

            // Update Next Slide Preview
            if (currentSlide < totalSlides - 1) {
                const nextNum = currentSlide + 2;
                document.getElementById('nextSlideIframe').src = `slide-${String(nextNum).padStart(2, '0')}.html`;
                document.getElementById('nextSlideNum').textContent = `اسلاید ${toPersianDigits(nextNum)}`;
                document.getElementById('nextSlideTitle').textContent = slideTitles[currentSlide + 1];
            } else {
                document.getElementById('nextSlideNum').textContent = 'پایان اسلایدها';
                document.getElementById('nextSlideTitle').textContent = 'پایان جلسه اول';
            }

            document.getElementById('currentSlideInfo').textContent = `اسلاید ${toPersianDigits(num)} از ${toPersianDigits(totalSlides)}`;
            document.getElementById('slideTitleDisplay').textContent = slideTitles[currentSlide] || `اسلاید ${num}`;
            document.getElementById('notesText').innerHTML = `<p>${slidesNotes[currentSlide] || 'یادداشت خاصی برای این اسلاید ثبت نشده است.'}</p>`;
            document.getElementById('gotoSlideInput').value = num;
            updateThumbs();
        }

        // BroadcastChannel to sync with audience.html
        const channel = new BroadcastChannel('presentation-channel');
        function broadcastSlideChange() {
            channel.postMessage({ type: 'slide-change', slideIndex: currentSlide });
        }

        channel.onmessage = (event) => {
            if (event.data && event.data.type === 'slide-change') {
                if (event.data.slideIndex !== currentSlide) {
                    currentSlide = event.data.slideIndex;
                    updateMainView();
                }
            }
        };

        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            currentSlide = index;
            updateMainView();
            broadcastSlideChange();
        }

        function nextSlide() { goToSlide(currentSlide + 1); }
        function prevSlide() { goToSlide(currentSlide - 1); }

        document.getElementById('btnNextTop').addEventListener('click', nextSlide);
        document.getElementById('btnPrevTop').addEventListener('click', prevSlide);

        // Standard Keyboard Navigation (Right Arrow = Next, Left Arrow = Prev)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key.toLowerCase() === 'n') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key.toLowerCase() === 'p') {
                e.preventDefault();
                prevSlide();
            }
        });

        // Go to slide input
        document.getElementById('gotoSlideBtn').addEventListener('click', () => {
            const val = parseInt(document.getElementById('gotoSlideInput').value) - 1;
            if (!isNaN(val)) goToSlide(val);
        });

        // Presentation Timer
        let timerSeconds = 0;
        let timerInterval = null;
        const timerEl = document.getElementById('timer');
        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        document.getElementById('timerToggle').addEventListener('click', function () {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                this.textContent = '▶ Start';
                this.classList.replace('bg-amber-600', 'bg-blue-600');
            } else {
                timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000);
                this.textContent = '⏸ Pause';
                this.classList.replace('bg-blue-600', 'bg-amber-600');
            }
        });

        document.getElementById('timerReset').addEventListener('click', () => {
            timerSeconds = 0;
            updateTimerDisplay();
        });

        // Autoplay Feature
        let autoplayTimer = null;
        const autoplayToggle = document.getElementById('autoplayToggle');
        const autoplayInterval = document.getElementById('autoplayInterval');

        function setupAutoplay() {
            if (autoplayTimer) clearInterval(autoplayTimer);
            if (autoplayToggle.checked) {
                const ms = (parseInt(autoplayInterval.value) || 10) * 1000;
                autoplayTimer = setInterval(() => {
                    if (currentSlide < totalSlides - 1) {
                        nextSlide();
                    } else {
                        goToSlide(0);
                    }
                }, ms);
            }
        }

        autoplayToggle.addEventListener('change', setupAutoplay);
        autoplayInterval.addEventListener('change', setupAutoplay);

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // Initial Load
        updateMainView();
    </script>
</body>

</html>
